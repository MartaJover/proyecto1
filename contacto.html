<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Contacto Marta Jover</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img
            src="https://res.cloudinary.com/ssamn4fj/image/upload/v1793822477/marta-jover-monograma.svg"
            alt="logo mj"
            class="logo heartbeat"
          />
        </a>
        <ul class="nav-links">
          <li><a href="about.html">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#cheatsheets">Cheatsheets</a></li>
          <li><a href="#recursos">Recursos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contact-section">
        <h1>Contacto</h1>
        <h2 class="contact-intro">
          ¿Quieres empezar un nuevo proyecto? Hablemos
        </h2>
        <div class="contact-container">
          <form action="/enviar" method="POST" class="contact-form">
            <fieldset>
              <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input
                  id="nombre"
                  name="nombre"
                  type="text"
                  placeholder="Nombre"
                />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="nombre@email.com"
                  required
                />
              </div>

              <div class="form-group">
                <label for="asunto">Asunto:</label>
                <input
                  type="text"
                  id="asunto"
                  name="asunto"
                  placeholder="Asunto"
                  required
                />
              </div>

              <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea
                  name="mensaje"
                  id="mensaje"
                  cols="30"
                  rows="10"
                  placeholder="Escribe aquí tu mensaje"
                  required
                ></textarea>
              </div>

              <input type="submit" class="btn-submit" />
            </fieldset>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
